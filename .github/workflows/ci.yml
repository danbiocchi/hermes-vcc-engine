name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install "pytest>=8,<10"
      # Engine tests need a Hermes install and skip here; run them locally against yours.
      - run: python -m pytest -q -rs
        env:
          HERMES_AGENT_DIR: /nonexistent

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no invisible unicode or committed bytecode
        run: |
          ! grep -rnP '[\x{200b}-\x{200f}\x{202a}-\x{202e}\x{2066}-\x{2069}\x{feff}]' --include='*.py' .
          ! find . -name '*.pyc' -o -name '*.pyo' | grep .
